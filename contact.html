<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Marlow Interiors</title>
<meta name="description" content="Marlow Interiors — interior design studio creating quiet, considered spaces for homes and hospitality.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#f6f5f4;
    --ink:#171310;
    --pad:clamp(20px, 4vw, 48px);
    --gap:clamp(14px, 1.6vw, 24px);
    --footer-h:clamp(320px, 32vw, 420px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Hanken Grotesk', sans-serif;
    background:var(--ivory);
    color:var(--ink);
    overflow-x:hidden;
  }
  @keyframes page-in{
    from{ opacity:0; transform:scale(0.97); }
    to{ opacity:1; transform:scale(1); }
  }
  a{ color:inherit; }

  .site-header{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:24px var(--pad);
    background:var(--ivory);
    border-bottom:1px solid rgba(23,19,16,0.08);
  }
  .site-header img{ height:44px; width:auto; display:block; cursor:pointer; }
  .site-header nav{
    display:flex;
    align-items:center;
    gap:clamp(20px, 2.6vw, 40px);
  }
  .site-header nav a{
    color:var(--ink);
    text-decoration:none;
    font-size:clamp(15px, 1.4vw, 20px);
    font-weight:400;
    letter-spacing:-0.02em;
    opacity:0.65;
    transition:opacity 0.2s ease;
  }
  .site-header nav a:hover, .site-header nav a.active{ opacity:1; }
  @media (max-width:640px){
    .site-header nav{ display:none; }
  }

  .page-content{
    position:relative;
    z-index:2;
    background:var(--ivory);
    margin-bottom:var(--footer-h);
    animation:page-in 0.6s ease backwards;
    min-height:70vh;
    display:grid;
    align-items:center;
    justify-items:start;
    padding:0 var(--pad);
  }
  .page-content h1{
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:clamp(40px, 6vw, 84px);
    letter-spacing:-0.03em;
    opacity:0.85;
  }

  .site-footer{
    position:fixed;
    bottom:0; left:0; right:0;
    z-index:1;
    height:var(--footer-h);
    font-size:14px;
    color:var(--ivory);
    background:var(--ink);
    padding:var(--pad);
  }
  .footer-grid{
    display:grid;
    grid-template-columns:auto auto 1fr auto auto;
    grid-template-rows:1fr auto;
    grid-template-areas:
      "logo logo . . ."
      "contacts address rs legal credits";
    gap:1em calc(var(--gap) * 2);
    min-height:clamp(220px, 28vw, 320px);
  }
  @media (max-width:900px){
    .footer-grid{
      grid-template-columns:1fr;
      grid-template-rows:auto;
      grid-template-areas:"logo" "contacts" "address" "rs" "legal" "credits";
    }
  }
  .footer-grid > *{ display:grid; gap:0.35em; align-content:end; }
  .footer-grid a{ color:inherit; text-decoration:none; opacity:0.85; }
  .footer-grid a:hover{ opacity:1; }
  .footer-logo{
    grid-area:logo;
    align-items:start;
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:clamp(40px, 7vw, 96px);
    letter-spacing:-0.03em;
    line-height:0.95;
  }
  .footer-logo span{
    display:block;
    font-family:'Hanken Grotesk', sans-serif;
    font-weight:400;
    font-size:clamp(14px, 1.2vw, 18px);
    letter-spacing:0.02em;
    opacity:0.7;
    margin-top:0.2em;
  }
  .contacts{ grid-area:contacts; }
  .address{ grid-area:address; }
  .rs{ grid-area:rs; }
  .legal{ grid-area:legal; }
  .credits{ grid-area:credits; opacity:0.6; }

  .cut-transition{
    position:fixed;
    inset:0;
    z-index:100;
    background:#000;
    opacity:0;
    pointer-events:none;
  }
  .page-wipe{
    position:fixed;
    inset:0;
    z-index:99;
    background:var(--ivory);
    transform:translateX(0);
    pointer-events:none;
  }
</style>
</head>
<body>

<div class="cut-transition" id="cutTransition"></div>
<div class="page-wipe" id="pageWipe"></div>

<header class="site-header">
  <a href="index.html" id="logoHome" style="display:block;">
    <img src="assets/marlow-logo.png" alt="Marlow Interiors" draggable="false" style="cursor:pointer;display:block;-webkit-user-drag:none;">
  </a>
  <nav>
    <a href="projects.html">Projects</a>
    <a href="archive.html">Archive</a>
    <a href="studio.html">Studio</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<div class="page-content">
  <h1>Contact</h1>
</div>

<footer class="site-footer">
  <div class="footer-grid">
    <div class="footer-logo">Marlow<span>Interior Design Studio</span></div>
    <div class="contacts">
      <a href="mailto:hello@marlowinteriors.com">hello@marlowinteriors.com</a>
      <a href="tel:+13055550148">+1 (305) 555-0148</a>
    </div>
    <div class="address">
      <span>140 NE 39th St</span>
      <span>Miami, FL 33137</span>
    </div>
    <div class="rs">
      <a href="#" target="_blank" rel="noopener">Instagram</a>
      <a href="#" target="_blank" rel="noopener">LinkedIn</a>
    </div>
    <div class="legal">
      <a href="#">Legal Notice</a>
      <a href="#">Privacy Policy</a>
    </div>
    <div class="credits">
      <p>&copy; 2026, Marlow Interiors</p>
    </div>
  </div>
</footer>

<script>
  requestAnimationFrame(function(){
    var wipe = document.getElementById('pageWipe');
    wipe.style.transition = 'transform 0.6s cubic-bezier(.76,0,.24,1)';
    wipe.style.transform = 'translateX(100%)';
  });

  document.getElementById('logoHome').addEventListener('click', function(e){
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    var overlay = document.getElementById('cutTransition');
    overlay.style.transition = 'opacity 0.5s ease';
    overlay.style.opacity = '1';
    setTimeout(function(){ window.location.href = 'index.html'; }, 500);
  });
</script>

</body>
</html>
