<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marlow Interiors | Interior Design Studio</title>
<meta name="description" content="Marlow Interiors — interior design studio creating quiet, considered spaces for homes and hospitality.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/swiper-bundle.min.css">
<style>
  :root{
    --ivory:#f6f5f4;
    --ink:#171310;
    --bg-fallback:#3a2a22;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Hanken Grotesk', sans-serif;
    background:var(--bg-fallback);
    color:var(--ivory);
    overflow-x:hidden;
  }

  /* ── Real Swiper.js in cssMode — the actual mechanism confirmed by
     pulling dsgninterior.se's own live CSS/JS bundles directly:
     .swiper-wrapper carries scroll-snap-type:y mandatory, each
     .swiper-slide carries scroll-snap-align:start, and their init call
     passes cssMode:true (plus resistanceRatio:0, parallax:true). That
     means the hero is a REAL native-scroll region — the browser's own
     scroll physics move it continuously as you scroll, snapping to the
     nearest slide when you stop — not a JS-transform carousel that
     waits for a wheel tick then plays one canned animation regardless
     of how much you actually scrolled. That distinction is exactly
     what read as "just scrolling" / "not already moving" before: a
     JS-transform Swiper can play a very smooth animation, but it will
     never feel like real scroll, because it isn't driven by real
     scroll. cssMode is real scroll, so it can't feel like anything
     else. It also removes the entire bug class that hit this build
     twice: with slides genuinely stacked in normal flow instead of
     absolutely-positioned-then-transformed-off-screen, there's no
     off-screen offset for a parallax shift to ever cancel out. ── */
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    min-height:560px;
    overflow:hidden;
    background:var(--bg-fallback);
  }
  .hero-swiper{ width:100%; height:100%; }
  /* scroll-behavior stays auto (not smooth) — the click-to-advance JS
     drives scrollTop itself with its own easing curve, and
     scroll-behavior:smooth would make the browser ALSO try to smoothly
     animate those per-frame assignments on top of it. freeMode (set in
     JS below) is what actually turns off snap-to-completion — it adds
     Swiper's own swiper-free-mode class, which its stylesheet uses to
     set scroll-snap-type:none at higher specificity than anything
     declared here, so there's no point duplicating it in this file. */
  /* overscroll-behavior:contain stops the browser's own rubber-band
     bounce at the very top/bottom of this scroll container — without
     it, scrollTop can briefly go slightly negative or past maxScroll
     right at the edges before springing back, which is the real source
     of the brown-background flash right at the ends of the scroll
     (belt-and-suspenders with the clamp in the JS render loop below). */
  .hero-swiper .swiper-wrapper{ scroll-behavior:auto; overscroll-behavior:contain; }
  /* Graceful degradation: if Swiper's JS never runs for any reason
     (blocked script, network failure), Swiper never adds the
     "swiper-initialized" class it normally adds on init. In that
     case, hide every slide but the first so the page degrades to a
     clean static hero instead of every slide dumping into normal
     document flow and stacking/cutting off text. */
  .hero-swiper:not(.swiper-initialized) .swiper-slide:not(:first-child){
    display:none;
  }
  /* Oversized on top/bottom (65% of the slide's own height each way)
     so the 60% data-swiper-parallax shift on this element — see the
     markup below — never exposes a gap at the slide's edge while it's
     scrolled past. Matches the reference's own oversized background
     media for the same reason. */
  .slide-media{ position:absolute; top:-65%; left:0; right:0; bottom:-65%; }
  .slide-media video,
  .slide-media img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .stage::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    background:linear-gradient(
      180deg,
      rgba(20,14,10,0.35) 0%,
      rgba(20,14,10,0.05) 28%,
      rgba(20,14,10,0.10) 60%,
      rgba(15,10,7,0.55) 100%
    );
    pointer-events:none;
  }

  /* ── Nav — fixed globally, same as dsgninterior.se's header: it sits
     above the swiper and never moves while slides change beneath it ── */
  .hero-nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:28px clamp(20px, 4vw, 48px);
  }
  .hero-nav img{
    height:68px;
    width:auto;
    display:block;
  }
  .hero-nav nav{
    display:flex;
    align-items:center;
    gap:clamp(20px, 2.6vw, 40px);
    position:relative;
    top:-14px;
  }
  .hero-nav nav a{
    color:var(--ivory);
    text-decoration:none;
    font-size:clamp(16px, 1.6vw, 24px);
    font-weight:400;
    letter-spacing:-0.033em;
    opacity:0.88;
    transition:opacity 0.2s ease;
  }
  .hero-nav nav a:hover{ opacity:1; }
  @media (max-width:640px){
    .hero-nav nav{ display:none; }
  }

  /* ── Headline ── */
  /* overflow:hidden is load-bearing, not tidiness: .slide-media is
     oversized on top/bottom (see below) so its parallax shift never
     exposes a gap. Slides are genuine stacked document flow now (real
     scroll), so without this, an adjacent slide's oversized background
     physically pokes into view regardless of scroll position — this is
     the third distinct way this same bug class has shown up. Confirmed
     the reference does the same: its own .banner rule carries
     overflow:hidden for exactly this reason. */
  .swiper-slide{
    display:flex;
    align-items:center;
    overflow:hidden;
  }
  /* Explicit stacking order for the cover effect (see the scroll
     listener in the script): the hero gets a transform applied to hold
     it visually in place, and transform creates its own stacking
     context, so DOM order alone can't be trusted to keep Bayshore
     painting on top of it. */
  .swiper-slide:nth-child(1){ z-index:1; }
  .swiper-slide:nth-child(2){ z-index:2; }
  /* Centered to match the reference's .banner-title look (previously
     only the project title was centered, hero was left-stacked, which
     read as inconsistent). NOT copying their exact position:absolute;
     inset:0 sizing though: tried that first and it immediately brought
     back the full bleed bug — confirmed the inline transform Swiper's
     parallax module applies is translate3d(0,-100%,0), and at 100% of
     an element sized to the FULL slide, that's a full slide-height
     shift, exactly canceling the slide's own off-screen offset again.
     Fourth time this exact bug class has shown up from a parallax-
     tagged element matching the slide's own size — not worth a fifth.
     Kept content-sized (this wrapper only as tall as its own text) and
     centered via flex + text-align instead, which gets the identical
     visual result with no element ever reaching slide-height. */
  .hero-title-wrap{
    position:relative;
    z-index:2;
    width:100%;
    display:flex;
    justify-content:center;
    text-align:center;
  }
  .hero-content{
    position:relative;
    padding:0 clamp(20px, 5vw, 64px);
    text-align:center;
  }
  .hero-title-line{
    /* no overflow:hidden here — nothing animates through a mask on this
       element, and clipping a font's descenders (g/y/p) is never worth
       the risk just to keep a box tidy */
  }
  .hero-title{
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:clamp(46px, 8.45vw, 150px);
    line-height:1;
    letter-spacing:-0.047em;
    color:var(--ivory);
    white-space:nowrap;
  }
  @media (max-width:640px){
    .hero-title{ line-height:1.05; white-space:normal; }
  }

  /* ── Contact block, bottom-left — fixed globally, same as the
     reference's footer, which sits fixed above the swiper too ── */
  .hero-contact{
    position:fixed;
    left:clamp(20px, 4vw, 48px);
    bottom:clamp(20px, 4vw, 40px);
    z-index:50;
    display:flex;
    gap:clamp(28px, 4vw, 56px);
  }
  .hero-contact div p,
  .hero-contact div a{
    display:block;
    color:var(--ivory);
    font-size:15px;
    font-weight:500;
    letter-spacing:-0.01em;
    text-decoration:none;
    opacity:0.92;
    line-height:1.5;
  }
  @media (max-width:640px){
    .hero-contact{ display:none; }
  }

  /* ── Scroll indicator, bottom-right — fixed globally ── */
  .scroll-indicator{
    position:fixed;
    right:clamp(20px, 4vw, 48px);
    bottom:clamp(20px, 4vw, 40px);
    z-index:50;
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--ivory);
    font-size:13px;
    font-weight:500;
    letter-spacing:0.02em;
    opacity:0.9;
  }
  .scroll-indicator .ring{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid rgba(246,245,244,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .scroll-indicator .ring svg{
    width:12px;
    height:12px;
    animation:bob 1.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(-2px); }
    50%{ transform:translateY(2px); }
  }
  @media (max-width:640px){
    .scroll-indicator span{ display:none; }
    .scroll-indicator{ right:20px; bottom:20px; }
  }

  /* ── Project title — same content-sized-and-centered treatment as
     .hero-title-wrap, and same reasoning: not the reference's own
     position:absolute;inset:0 sizing, for the same bleed-bug reason. ── */
  .project-title-wrap{
    position:relative;
    z-index:2;
    width:100%;
    display:flex;
    justify-content:center;
  }
  /* Same font-size/line-height/letter-spacing as .hero-title —
     previously smaller (clamp(36px,6vw,96px) vs the hero's
     clamp(46px,8.45vw,150px)), which read as inconsistent given both
     wraps center the same way in an identically-sized slide. */
  .project-title{
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:clamp(46px, 8.45vw, 150px);
    line-height:1;
    letter-spacing:-0.047em;
    color:var(--ivory);
    text-align:center;
    white-space:nowrap;
    padding:0 24px;
  }
  @media (max-width:640px){
    .project-title{ white-space:normal; }
  }
</style>
</head>
<body>

<div class="hero-nav">
  <img src="assets/marlow-logo-white.png" alt="Marlow Interiors">
  <nav>
    <a href="#">Projects</a>
    <a href="#">Archive</a>
    <a href="#">Studio</a>
    <a href="#">Contact</a>
  </nav>
</div>

<div class="hero-contact">
  <div>
    <a href="mailto:hello@marlowinteriors.com">hello@marlowinteriors.com</a>
    <a href="tel:+13055550148">+1 (305) 555-0148</a>
  </div>
  <div>
    <p>140 NE 39th St</p>
    <p>Miami, FL 33137</p>
  </div>
</div>

<button class="scroll-indicator" id="scrollBtn" style="background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:none;">
  <span>Scroll to explore</span>
  <div class="ring">
    <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 4L6 9L11 4" stroke="#f6f5f4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</button>

<section class="stage" id="stage">
  <div class="hero-swiper swiper">
    <div class="swiper-wrapper">

      <div class="swiper-slide">
        <div class="slide-media">
          <video autoplay muted loop playsinline preload="auto">
            <source src="assets/marlow-hero.mp4" type="video/mp4">
          </video>
        </div>
        <div class="hero-title-wrap">
          <div class="hero-content">
            <div class="hero-title-line"><div class="hero-title">quiet interiors</div></div>
            <div class="hero-title-line"><div class="hero-title">considered living</div></div>
          </div>
        </div>
      </div>

      <div class="swiper-slide">
        <div class="slide-media">
          <img src="assets/gallery/project1-banner.jpg" alt="Bayshore Residence">
        </div>
        <div class="project-title-wrap">
          <h2 class="project-title">Bayshore Residence</h2>
        </div>
      </div>

    </div>
  </div>
</section>

<script src="assets/vendor/swiper-bundle.min.js"></script>
<script>
  /* cssMode + resistanceRatio:0 + mousewheel.forceToAxis — pulled
     directly from dsgninterior.se's own live app bundle. This hands
     slide positioning to the browser's native scroll-snap, so Swiper's
     job here is just tracking index; it never fights real scroll input
     with a canned animation the way JS-transform mode did.

     parallax:true (matching their config) was removed again after it
     came back to bite a fourth time: with the hero/Bayshore held static
     by the custom reveal system below, Swiper's parallax module was
     STILL shifting hero's video/title internally off of hero's own real
     scroll progress — small at first, but by deep scroll it was large
     enough to push the video out of its own frame and expose the raw
     .stage background color underneath (the "brown bar" Travis kept
     screenshotting), plus a smaller version of the same shift on the
     title text read as "bouncing". The custom reveal system fully
     replaces what parallax was for here, so there's nothing left for it
     to usefully do — removed the module and every data-swiper-parallax
     attribute in the markup, not just tuned it again.

     In cssMode, Swiper's mousewheel module still intercepts every wheel
     event itself (calls preventDefault, then scrolls the wrapper
     programmatically) rather than handing it to the browser untouched —
     default sensitivity:1 multiplies a single mouse-wheel notch
     (~100-120px of native deltaY) almost 1:1, which covers most of a
     slide's height in one or two notches. What's left then gets
     completed instantly by scroll-snap-type:mandatory, so the motion
     reads as a quick, two-phase snap rather than something that follows
     your scrolling. Sensitivity well below 1 spreads that same input
     across many more notches so the climb reads as continuous instead
     of a jump-then-snap. */
  /* freeMode:true — Travis wants zero auto-completion: wherever a
     scroll gesture stops, it just stays there, piece by piece, full
     manual control. Without it, scroll-snap-type:mandatory (matching
     the reference's own confirmed CSS) auto-finishes the transition
     the moment you let go past the midpoint — reads as "too fast" no
     matter how gently the active scrolling itself is tuned, since the
     snap-to-completion isn't something scroll speed controls at all.
     This is an explicit, deliberate difference from the reference's
     mechanism, not a mismatch to fix. */
  var heroSwiper = new Swiper('.hero-swiper', {
    direction: 'vertical',
    slidesPerView: 1,
    speed: 1100,
    resistanceRatio: 0,
    cssMode: true,
    freeMode: true,
    mousewheel: {
      enabled: true,
      forceToAxis: true,
      sensitivity: 0.045
    }
  });

  /* Custom eased scrollTo, used ONLY for discrete click actions
     (scrollBtn, click-to-advance below) — not for anything tied to an
     ongoing scroll gesture. A debounced version of this used to also
     drive the settle-after-scrolling, but on real trackpad input any
     brief pause mid-gesture made it jump in and fight the next bit of
     input, feeling like the page was twitching against your fingers.
     Settling after a real scroll gesture is native
     scroll-snap-type:mandatory now (see CSS) — matches the reference's
     own confirmed mechanism exactly, and native scroll-snap already
     knows how to tell "gesture genuinely ended" from "brief pause" in a
     way a JS debounce timer can't approximate. Discrete clicks have no
     such risk (nothing else is scrolling at that moment), so they keep
     the fully custom, tunable-duration animation. */
  var wrapperEl = heroSwiper.wrapperEl;

  function easeInOutCubic(t){
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function smoothScrollToIndex(index, duration){
    var target = Math.max(0, Math.min(index, heroSwiper.slides.length - 1)) * wrapperEl.clientHeight;
    var startTop = wrapperEl.scrollTop;
    var delta = target - startTop;
    if (Math.abs(delta) < 1) return;
    var startTime = null;
    function step(now){
      if (startTime === null) startTime = now;
      var progress = Math.min((now - startTime) / duration, 1);
      wrapperEl.scrollTop = startTop + delta * easeInOutCubic(progress);
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function currentIndex(){
    return Math.round(wrapperEl.scrollTop / wrapperEl.clientHeight);
  }

  document.getElementById('scrollBtn').addEventListener('click', function(){
    smoothScrollToIndex(currentIndex() + 1, 1400);
  });

  /* Reveal effect, not a cover effect: Travis clarified further — even
     with the hero held static, Bayshore Residence itself still visibly
     translated into place, which read as "the image is coming up/in".
     What he actually wants is closer to a curtain lifting: Bayshore's
     photo and title should sit in their final, already-composed
     position the entire time and simply become visible as you scroll,
     never sliding to get there.

     The scroll mechanism itself is still completely untouched (real
     scroll still drives everything the same way) — this only adds two
     things per scroll event: the same equal-and-opposite counter-
     transform as before, now applied to BOTH slides so NEITHER one's
     content ever visibly moves, and a clip-path on Bayshore that grows
     from fully hidden to fully shown as scroll progresses, revealing
     its already-static composition rather than sliding it into frame.
     data-swiper-parallax was removed from Bayshore's media/title in the
     markup for the same reason — any independent internal motion there
     would contradict "already there, just revealed". */
  var heroSlideEl = heroSwiper.slides[0];
  var bayshoreSlideEl = heroSwiper.slides[1];
  var maxScroll = wrapperEl.scrollHeight - wrapperEl.clientHeight;
  var lastRenderedScroll = null;
  function renderReveal(){
    /* Clamped to [0, maxScroll] — real trackpad/OS overscroll
       (rubber-banding) can briefly report a scrollTop slightly below 0
       or above maxScroll right at either end before it springs back.
       Unclamped, that briefly fed an out-of-range value into the
       transforms below, shifting hero/Bayshore just enough to expose a
       sliver of the raw .stage background at exactly the top or bottom
       edge — the brown flash Travis kept seeing specifically "when
       scrolling up a little" or "back down", i.e. right at the ends,
       never in the middle. Clamping means an overscrolled value renders
       identically to the true boundary, so there's nothing left to leak
       through. */
    var s = Math.min(Math.max(wrapperEl.scrollTop, 0), maxScroll);
    /* Skip the DOM writes entirely when nothing changed — this loop
       runs every frame forever, and touching style/transform on two
       elements 60x/sec even at rest is wasted work for zero visual
       benefit. */
    if (s !== lastRenderedScroll){
      lastRenderedScroll = s;
      heroSlideEl.style.transform = 'translateY(' + s + 'px)';
      bayshoreSlideEl.style.transform = 'translateY(' + (s - wrapperEl.clientHeight) + 'px)';
      var progress = maxScroll > 0 ? s / maxScroll : 0;
      bayshoreSlideEl.style.clipPath = 'inset(' + ((1 - progress) * 100) + '% 0 0 0)';
    }
    requestAnimationFrame(renderReveal);
  }
  /* Driven by rAF every frame, not the 'scroll' event: on real fast
     trackpad scrolling the browser can repaint faster than scroll
     events actually fire (they're throttled/coalesced under load), so
     for a frame or two the compensating transform was stale — visible
     as the whole composition briefly jumping/bouncing and the raw
     .stage background flashing through in the gap. rAF ties this to
     the same clock the browser paints on, so it can't fall behind. */
  requestAnimationFrame(renderReveal);

  /* Click-to-advance on the hero itself. Deliberately not on <a>/
     <button> and no cursor:pointer anywhere — Travis wants this to
     stay looking like plain, non-interactive hero copy, just with a
     click shortcut layered underneath, not something that visibly
     invites clicking. .hero-nav/.hero-contact/scrollBtn are separate
     fixed-position siblings of .stage, not descendants of it, so their
     own clicks (nav links, mailto/tel, the scroll button) never reach
     this listener regardless of visual overlap. */
  document.getElementById('stage').addEventListener('click', function(){
    smoothScrollToIndex(currentIndex() + 1, 1400);
  });
</script>

</body>
</html>
