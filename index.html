<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marlow Interiors | Interior Design Studio</title>
<meta name="description" content="Marlow Interiors — interior design studio creating quiet, considered spaces for homes and hospitality.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/swiper-bundle.min.css">
<style>
  :root{
    --ivory:#f6f5f4;
    --ink:#171310;
    --bg-fallback:#3a2a22;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Hanken Grotesk', sans-serif;
    background:var(--bg-fallback);
    color:var(--ivory);
    overflow-x:hidden;
  }

  /* ── Real Swiper.js slide-travel + parallax, continuously bound to
     scroll (not touch/wheel snap). A tall wrapper (scroll runway)
     holds a position:sticky stage containing the actual Swiper
     instance; on every scroll tick we call swiper.setProgress() with
     our own 0-1 value, so Swiper computes the real slide transform
     AND the per-layer parallax offsets (data-swiper-parallax, same
     values as dsgninterior.se) continuously — no snapping, because
     nothing ever jumps to a discrete slide index, it just tracks
     scroll position 1:1 the whole way through. ── */
  .stage-wrap{
    position:relative;
    height:220vh;
    height:220dvh;
  }
  .stage{
    position:sticky;
    top:0;
    width:100%;
    height:100vh;
    height:100dvh;
    min-height:560px;
    overflow:hidden;
    background:var(--bg-fallback);
  }
  .hero-swiper{ width:100%; height:100%; }
  /* Graceful degradation: if Swiper's JS never runs for any reason
     (blocked script, network failure), Swiper never adds the
     "swiper-initialized" class it normally adds on init. In that
     case, hide every slide but the first so the page degrades to a
     clean static hero instead of every slide dumping into normal
     document flow and stacking/cutting off text. */
  .hero-swiper:not(.swiper-initialized) .swiper-slide:not(:first-child){
    display:none;
  }
  .slide-media{ position:absolute; inset:0; }
  .slide-media video,
  .slide-media img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .stage::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    background:linear-gradient(
      180deg,
      rgba(20,14,10,0.35) 0%,
      rgba(20,14,10,0.05) 28%,
      rgba(20,14,10,0.10) 60%,
      rgba(15,10,7,0.55) 100%
    );
    pointer-events:none;
  }

  /* ── Nav — fixed globally, same as dsgninterior.se's header: it sits
     above the swiper and never moves while slides change beneath it ── */
  .hero-nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:28px clamp(20px, 4vw, 48px);
  }
  .hero-nav img{
    height:68px;
    width:auto;
    display:block;
  }
  .hero-nav nav{
    display:flex;
    align-items:center;
    gap:clamp(20px, 2.6vw, 40px);
    position:relative;
    top:-14px;
  }
  .hero-nav nav a{
    color:var(--ivory);
    text-decoration:none;
    font-size:clamp(16px, 1.6vw, 24px);
    font-weight:400;
    letter-spacing:-0.033em;
    opacity:0.88;
    transition:opacity 0.2s ease;
  }
  .hero-nav nav a:hover{ opacity:1; }
  @media (max-width:640px){
    .hero-nav nav{ display:none; }
  }

  /* ── Headline ── */
  .hero-title-wrap{
    position:absolute;
    inset:0;
    z-index:2;
  }
  .hero-content{
    position:relative;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:0 clamp(20px, 5vw, 64px);
    padding-top:18px; /* clearance from top edge so tight line-height never clips ascenders */
  }
  .hero-title-line{
    /* no overflow:hidden here — nothing animates through a mask on this
       element, and clipping a font's descenders (g/y/p) is never worth
       the risk just to keep a box tidy */
  }
  .hero-title{
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:clamp(46px, 8.45vw, 150px);
    line-height:1;
    letter-spacing:-0.047em;
    color:var(--ivory);
    white-space:nowrap;
  }
  @media (max-width:640px){
    .hero-title{ line-height:1.05; white-space:normal; }
  }

  /* ── Contact block, bottom-left — fixed globally, same as the
     reference's footer, which sits fixed above the swiper too ── */
  .hero-contact{
    position:fixed;
    left:clamp(20px, 4vw, 48px);
    bottom:clamp(20px, 4vw, 40px);
    z-index:50;
    display:flex;
    gap:clamp(28px, 4vw, 56px);
  }
  .hero-contact div p,
  .hero-contact div a{
    display:block;
    color:var(--ivory);
    font-size:15px;
    font-weight:500;
    letter-spacing:-0.01em;
    text-decoration:none;
    opacity:0.92;
    line-height:1.5;
  }
  @media (max-width:640px){
    .hero-contact{ display:none; }
  }

  /* ── Scroll indicator, bottom-right — fixed globally ── */
  .scroll-indicator{
    position:fixed;
    right:clamp(20px, 4vw, 48px);
    bottom:clamp(20px, 4vw, 40px);
    z-index:50;
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--ivory);
    font-size:13px;
    font-weight:500;
    letter-spacing:0.02em;
    opacity:0.9;
  }
  .scroll-indicator .ring{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid rgba(246,245,244,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .scroll-indicator .ring svg{
    width:12px;
    height:12px;
    animation:bob 1.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(-2px); }
    50%{ transform:translateY(2px); }
  }
  @media (max-width:640px){
    .scroll-indicator span{ display:none; }
    .scroll-indicator{ right:20px; bottom:20px; }
  }

  /* ── Project title — centered, parallax-driven same as the hero
     title (data-swiper-parallax on the wrapper + inner span). ── */
  .project-title-wrap{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
  }
  .project-title{
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:clamp(36px, 6vw, 96px);
    letter-spacing:-0.03em;
    color:var(--ivory);
    text-align:center;
    white-space:nowrap;
    padding:0 24px;
  }
  @media (max-width:640px){
    .project-title{ white-space:normal; }
  }
</style>
</head>
<body>

<div class="hero-nav">
  <img src="assets/marlow-logo-white.png" alt="Marlow Interiors">
  <nav>
    <a href="#">Projects</a>
    <a href="#">Archive</a>
    <a href="#">Studio</a>
    <a href="#">Contact</a>
  </nav>
</div>

<div class="hero-contact">
  <div>
    <a href="mailto:hello@marlowinteriors.com">hello@marlowinteriors.com</a>
    <a href="tel:+13055550148">+1 (305) 555-0148</a>
  </div>
  <div>
    <p>140 NE 39th St</p>
    <p>Miami, FL 33137</p>
  </div>
</div>

<button class="scroll-indicator" id="scrollBtn" style="background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:none;">
  <span>Scroll to explore</span>
  <div class="ring">
    <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 4L6 9L11 4" stroke="#f6f5f4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</button>

<div class="stage-wrap" id="stageWrap">
  <section class="stage" id="stage">
    <div class="hero-swiper swiper">
      <div class="swiper-wrapper">

        <div class="swiper-slide">
          <div class="slide-media" data-swiper-parallax="60%">
            <video autoplay muted loop playsinline preload="auto">
              <source src="assets/marlow-hero.mp4" type="video/mp4">
            </video>
          </div>
          <div class="hero-title-wrap" data-swiper-parallax="100%">
            <div class="hero-content" data-swiper-parallax="-60">
              <div class="hero-title-line"><div class="hero-title">quiet interiors</div></div>
              <div class="hero-title-line"><div class="hero-title">considered living</div></div>
            </div>
          </div>
        </div>

        <div class="swiper-slide">
          <div class="slide-media" data-swiper-parallax="60%">
            <img src="assets/gallery/project1-banner.jpg" alt="Bayshore Residence">
          </div>
          <div class="project-title-wrap" data-swiper-parallax="100%">
            <h2 class="project-title" data-swiper-parallax="-60">Bayshore Residence</h2>
          </div>
        </div>

      </div>
    </div>
  </section>
</div>

<script src="assets/vendor/swiper-bundle.min.js"></script>
<script>
  /* Real Swiper.js, same parallax values as dsgninterior.se
     (data-swiper-parallax="60%" on the media, "100%"/-60 on the
     title), but instead of letting Swiper handle touch/wheel input
     itself (which snaps per-tick), we disable its own input handling
     entirely and drive swiper.setProgress() continuously from our own
     scroll position — this keeps the real slide-travel + parallax
     math (Swiper's own engine) but ties it 1:1 to scroll instead of
     snapping, so every intermediate scroll position shows the real
     intermediate transform/parallax state. */
  var stageWrap = document.getElementById('stageWrap');
  var heroSwiper = new Swiper('.hero-swiper', {
    direction: 'vertical',
    parallax: true,
    allowTouchMove: false,
    simulateTouch: false,
    speed: 0
  });

  function stageProgress(){
    var rect = stageWrap.getBoundingClientRect();
    var scrollable = rect.height - window.innerHeight;
    if (scrollable <= 0) return 0;
    var raw = -rect.top / scrollable;
    return Math.max(0, Math.min(1, raw));
  }

  function updateStage(){
    heroSwiper.setProgress(stageProgress(), 0);
  }

  window.addEventListener('scroll', updateStage, { passive: true });
  updateStage();

  /* Click direction: a click on the stage only ever advances forward
     (hero -> project), never reverses. Real native smooth scroll —
     the scroll listener above keeps driving setProgress continuously
     throughout the animated scroll, so the click transition is just
     as continuous as a manual scroll, not a teleport. */
  function scrollToProgress(p){
    var rect = stageWrap.getBoundingClientRect();
    var scrollable = rect.height - window.innerHeight;
    var targetY = window.scrollY + rect.top + (scrollable * p);
    window.scrollTo({ top: targetY, behavior: 'smooth' });
  }

  document.getElementById('stage').addEventListener('click', function(){
    if (stageProgress() <= 0.5) scrollToProgress(1);
  });
  document.getElementById('scrollBtn').addEventListener('click', function(){
    scrollToProgress(1);
  });
</script>

</body>
</html>
