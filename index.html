<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marlow Interiors | Interior Design Studio</title>
<meta name="description" content="Marlow Interiors — interior design studio creating quiet, considered spaces for homes and hospitality.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#f6f5f4;
    --ink:#171310;
    --bg-fallback:#3a2a22;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Hanken Grotesk', sans-serif;
    background:var(--bg-fallback);
    color:var(--ivory);
    overflow-x:hidden;
  }

  /* ── No Swiper, no real scroll at all — a small custom wheel handler
     (see the script below) owns the transition entirely. Landed here
     after three rounds of chasing a subtle "bounce": the previous
     architecture kept both slides in real document flow and canceled
     each one's natural scroll-linked movement with an equal-and-
     opposite JS transform every frame, which only stays correct if the
     browser's real scroll position and that cancelling transform never
     drift apart — and under real trackpad input they kept finding new
     ways to (timing, rounding, overscroll, Swiper's own freeMode
     momentum). Removing the natural scroll position from both slides
     entirely (position:fixed) fixed that architecturally, but broke
     real wheel scrolling outright: Swiper's cssMode mousewheel handler
     computes its own scroll boundaries from each slide's real layout
     position, and slides outside document flow have none, so it had
     nothing to measure against. Those two requirements — Swiper owning
     wheel input, and slides with zero natural position — are
     structurally incompatible as long as Swiper owns the wheel
     mechanism. Solution: stop using Swiper for that at all. Both slides
     are plain position:absolute;inset:0 inside .stage, and a scroll
     PROGRESS value (0 to 1032, matching the old scrollTop range for
     continuity) lives in one JS variable, driven directly by a wheel
     listener with the same tuned sensitivity as before. Nothing else
     ever reads or writes a real scroll position, so there is no second
     number left for anything to drift against. */
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    min-height:560px;
    overflow:hidden;
    background:var(--bg-fallback);
  }
  /* No overscan needed — .slide-media never has any transform applied
     to it (the old parallax shift this used to compensate for was
     removed entirely), so it can just be inset:0 and covered plainly. */
  .slide-media{ position:absolute; inset:0; }
  .slide-media video,
  .slide-media img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .stage::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    background:linear-gradient(
      180deg,
      rgba(20,14,10,0.35) 0%,
      rgba(20,14,10,0.05) 28%,
      rgba(20,14,10,0.10) 60%,
      rgba(15,10,7,0.55) 100%
    );
    pointer-events:none;
  }

  /* ── Nav — fixed globally, same as dsgninterior.se's header: it sits
     above the swiper and never moves while slides change beneath it ── */
  .hero-nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:28px clamp(20px, 4vw, 48px);
  }
  .hero-nav img{
    height:68px;
    width:auto;
    display:block;
  }
  .hero-nav nav{
    display:flex;
    align-items:center;
    gap:clamp(20px, 2.6vw, 40px);
    position:relative;
    top:-14px;
  }
  .hero-nav nav a{
    color:var(--ivory);
    text-decoration:none;
    font-size:clamp(16px, 1.6vw, 24px);
    font-weight:400;
    letter-spacing:-0.033em;
    opacity:0.88;
    transition:opacity 0.2s ease;
  }
  .hero-nav nav a:hover{ opacity:1; }
  @media (max-width:640px){
    .hero-nav nav{ display:none; }
  }

  /* ── Headline ── */
  /* Plain position:absolute;inset:0 within .stage — no scroll flow, no
     transform, nothing ever moves these. Each one's position is 100%
     static CSS, permanently. */
  .swiper-slide{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    overflow:hidden;
  }
  .swiper-slide:nth-child(1){ z-index:1; }
  .swiper-slide:nth-child(2){ z-index:2; }
  /* Centered to match the reference's .banner-title look (previously
     only the project title was centered, hero was left-stacked, which
     read as inconsistent). NOT copying their exact position:absolute;
     inset:0 sizing though: tried that first and it immediately brought
     back the full bleed bug — confirmed the inline transform Swiper's
     parallax module applies is translate3d(0,-100%,0), and at 100% of
     an element sized to the FULL slide, that's a full slide-height
     shift, exactly canceling the slide's own off-screen offset again.
     Fourth time this exact bug class has shown up from a parallax-
     tagged element matching the slide's own size — not worth a fifth.
     Kept content-sized (this wrapper only as tall as its own text) and
     centered via flex + text-align instead, which gets the identical
     visual result with no element ever reaching slide-height. */
  .hero-title-wrap{
    position:relative;
    z-index:2;
    width:100%;
    display:flex;
    justify-content:center;
    text-align:center;
  }
  .hero-content{
    position:relative;
    padding:0 clamp(20px, 5vw, 64px);
    text-align:center;
  }
  .hero-title-line{
    /* no overflow:hidden here — nothing animates through a mask on this
       element, and clipping a font's descenders (g/y/p) is never worth
       the risk just to keep a box tidy */
  }
  .hero-title{
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:clamp(46px, 8.45vw, 150px);
    line-height:1;
    letter-spacing:-0.047em;
    color:var(--ivory);
    white-space:nowrap;
  }
  @media (max-width:640px){
    .hero-title{ line-height:1.05; white-space:normal; }
  }

  /* ── Contact block, bottom-left — fixed globally, same as the
     reference's footer, which sits fixed above the swiper too ── */
  .hero-contact{
    position:fixed;
    left:clamp(20px, 4vw, 48px);
    bottom:clamp(20px, 4vw, 40px);
    z-index:50;
    display:flex;
    gap:clamp(28px, 4vw, 56px);
  }
  .hero-contact div p,
  .hero-contact div a{
    display:block;
    color:var(--ivory);
    font-size:15px;
    font-weight:500;
    letter-spacing:-0.01em;
    text-decoration:none;
    opacity:0.92;
    line-height:1.5;
  }
  @media (max-width:640px){
    .hero-contact{ display:none; }
  }

  /* ── Scroll indicator, bottom-right — fixed globally ── */
  .scroll-indicator{
    position:fixed;
    right:clamp(20px, 4vw, 48px);
    bottom:clamp(20px, 4vw, 40px);
    z-index:50;
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--ivory);
    font-size:13px;
    font-weight:500;
    letter-spacing:0.02em;
    opacity:0.9;
  }
  .scroll-indicator .ring{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid rgba(246,245,244,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .scroll-indicator .ring svg{
    width:12px;
    height:12px;
    animation:bob 1.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(-2px); }
    50%{ transform:translateY(2px); }
  }
  @media (max-width:640px){
    .scroll-indicator span{ display:none; }
    .scroll-indicator{ right:20px; bottom:20px; }
  }

  /* ── Project title — same content-sized-and-centered treatment as
     .hero-title-wrap, and same reasoning: not the reference's own
     position:absolute;inset:0 sizing, for the same bleed-bug reason. ── */
  .project-title-wrap{
    position:relative;
    z-index:2;
    width:100%;
    display:flex;
    justify-content:center;
  }
  /* Same font-size/line-height/letter-spacing as .hero-title —
     previously smaller (clamp(36px,6vw,96px) vs the hero's
     clamp(46px,8.45vw,150px)), which read as inconsistent given both
     wraps center the same way in an identically-sized slide. */
  .project-title{
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:clamp(46px, 8.45vw, 150px);
    line-height:1;
    letter-spacing:-0.047em;
    color:var(--ivory);
    text-align:center;
    white-space:nowrap;
    padding:0 24px;
  }
  @media (max-width:640px){
    .project-title{ white-space:normal; }
  }
</style>
</head>
<body>

<div class="hero-nav">
  <img src="assets/marlow-logo-white.png" alt="Marlow Interiors">
  <nav>
    <a href="#">Projects</a>
    <a href="#">Archive</a>
    <a href="#">Studio</a>
    <a href="#">Contact</a>
  </nav>
</div>

<div class="hero-contact">
  <div>
    <a href="mailto:hello@marlowinteriors.com">hello@marlowinteriors.com</a>
    <a href="tel:+13055550148">+1 (305) 555-0148</a>
  </div>
  <div>
    <p>140 NE 39th St</p>
    <p>Miami, FL 33137</p>
  </div>
</div>

<button class="scroll-indicator" id="scrollBtn" style="background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:none;">
  <span>Scroll to explore</span>
  <div class="ring">
    <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 4L6 9L11 4" stroke="#f6f5f4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</button>

<section class="stage" id="stage">

  <div class="swiper-slide">
    <div class="slide-media">
      <video autoplay muted loop playsinline preload="auto">
        <source src="assets/marlow-hero.mp4" type="video/mp4">
      </video>
    </div>
    <div class="hero-title-wrap">
      <div class="hero-content">
        <div class="hero-title-line"><div class="hero-title">quiet interiors</div></div>
        <div class="hero-title-line"><div class="hero-title">considered living</div></div>
      </div>
    </div>
  </div>

  <div class="swiper-slide">
    <div class="slide-media">
      <img src="assets/gallery/project1-banner.jpg" alt="Bayshore Residence">
    </div>
    <div class="project-title-wrap">
      <h2 class="project-title">Bayshore Residence</h2>
    </div>
  </div>

</section>

<script>
  /* No Swiper. Both .swiper-slide elements are plain
     position:absolute;inset:0 with zero transform ever applied to
     their position — see the CSS comment above .stage for the full
     reasoning. One JS number (scrollProgress, 0 to MAX_SCROLL) is the
     single source of truth for the whole transition; a wheel listener
     is the only thing that changes it, and the render loop is the only
     thing that reads it. Nothing else in this file ever touches
     position, so there is nothing left for two independently-tracked
     numbers to drift apart from. */
  var stageEl = document.getElementById('stage');
  var slides = document.querySelectorAll('.swiper-slide');
  var bayshoreSlideEl = slides[1];
  var MAX_SCROLL = 1032;
  /* Travis: took too many scrolls to get through the transition once
     the bounce was gone — this is the one number that controls that,
     tune it directly here (higher = fewer scrolls needed). */
  var WHEEL_SENSITIVITY = 0.12;
  var scrollProgress = 0;

  function clamp(v, lo, hi){
    return Math.min(Math.max(v, lo), hi);
  }

  /* preventDefault + this file owning scrollProgress directly is the
     entire mechanism — piece by piece, stays exactly where you release
     it, zero auto-snap, exactly as before. No momentum, no bounce-back
     at the edges: nothing here ever adds motion beyond what the wheel
     itself just did. */
  stageEl.addEventListener('wheel', function(e){
    e.preventDefault();
    scrollProgress = clamp(scrollProgress + e.deltaY * WHEEL_SENSITIVITY, 0, MAX_SCROLL);
  }, { passive: false });

  function easeInOutCubic(t){
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  /* Discrete click actions only (scrollBtn, click-to-advance) — not
     tied to an ongoing wheel gesture, so animating scrollProgress
     directly here has no competing input to fight. */
  function smoothScrollToIndex(index, duration){
    var target = clamp(index, 0, 1) * MAX_SCROLL;
    var start = scrollProgress;
    var delta = target - start;
    if (Math.abs(delta) < 1) return;
    var startTime = null;
    function step(now){
      if (startTime === null) startTime = now;
      var t = Math.min((now - startTime) / duration, 1);
      scrollProgress = start + delta * easeInOutCubic(t);
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function currentIndex(){
    return Math.round(scrollProgress / MAX_SCROLL);
  }

  document.getElementById('scrollBtn').addEventListener('click', function(){
    smoothScrollToIndex(currentIndex() + 1, 1400);
  });

  /* Click-to-advance on the hero itself. Deliberately not on <a>/
     <button> and no cursor:pointer anywhere — stays looking like plain,
     non-interactive hero copy, just with a click shortcut layered
     underneath. .hero-nav/.hero-contact/scrollBtn are separate
     fixed-position siblings of .stage, not descendants of it, so their
     own clicks (nav links, mailto/tel, the scroll button) never reach
     this listener regardless of visual overlap. */
  stageEl.addEventListener('click', function(){
    smoothScrollToIndex(currentIndex() + 1, 1400);
  });

  /* Reveal effect: Bayshore's photo and title sit in their final,
     already-composed position permanently (plain CSS, no transform,
     see above) and a clip-path is the only thing that changes as
     scrollProgress moves — growing from fully hidden to fully shown,
     revealing what's already there rather than sliding it into frame. */
  var lastRendered = null;
  function renderReveal(){
    if (scrollProgress !== lastRendered){
      lastRendered = scrollProgress;
      var progress = scrollProgress / MAX_SCROLL;
      bayshoreSlideEl.style.clipPath = 'inset(' + ((1 - progress) * 100) + '% 0 0 0)';
    }
    requestAnimationFrame(renderReveal);
  }
  requestAnimationFrame(renderReveal);
</script>

</body>
</html>
